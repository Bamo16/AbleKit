name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Tag stores and Live's index use Windows paths; the library is only tested there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet test --solution AbletonSampleData.slnx
